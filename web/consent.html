<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect Motion</title>
    <link rel="stylesheet" href="/oauth/assets/consent.css" />
    <script type="module" src="/oauth/assets/consent.js"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">PRIVATE CONNECTION</p>
      <h1>Connect Motion</h1>
      <p id="message" role="status" aria-live="polite">Checking your connection…</p>
      <form id="login" hidden>
        <label for="email">Email for your private Motion login</label
        ><input id="email" name="email" type="email" autocomplete="email" required /><button
          type="submit"
        >
          Email me a sign-in link
        </button>
        <p class="note">
          Open the link in this browser. Your Supabase dashboard account and this private login are
          separate.
        </p>
      </form>
      <section id="consent" hidden>
        <h2 id="client"></h2>
        <p id="identity"></p>
        <ul id="permissions"></ul>
        <p class="note">
          Your Motion API key stays on the server. You can disconnect this app later.
        </p>
        <div class="actions">
          <button id="approve" type="button">Allow connection</button
          ><button id="deny" type="button" class="secondary">Cancel</button>
        </div>
      </section>
      <button id="signout" type="button" class="secondary" hidden>Sign out</button>
    </main>
  </body>
</html>
